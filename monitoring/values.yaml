prometheus:
  server:
    retention: 30d
    retentionSize: 50GB
    persistentVolume:
      enabled: true
      existingClaim: prometheus-data-pvc
    extraScrapeConfigs: |
      - job_name: 'kubernetes-service-endpoints-scrapper'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name

  kube-state-metrics:
    enabled: true

  prometheus-node-exporter:
    enabled: true

  prometheus-pushgateway:
    enabled: false

  alertmanager:
    enabled: false

grafana:
  persistence:
    enabled: true
    existingClaim: grafana-data-pvc

  admin:
    existingSecret: "metrics-grafana"
    userKey: admin-user
    passwordKey: admin-password

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://metrics-prometheus-server
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          url: http://metrics-loki.monitoring.svc.cluster.local:3100
          editable: false

loki:
  auth_enabled: false
  deploymentMode: SingleBinary
  
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    # 30-day retention. Live usage was ~200MB after 41 days, so this is far
    # below the 10Gi volume; shorten if that changes. Retention on tsdb/v13
    # needs the compactor to do the deletes, plus a delete_request_store.
    limits_config:
      retention_period: 720h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
    schemaConfig:
      configs:
        - from: "2024-04-01"
          object_store: filesystem
          store: tsdb
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

  # Loki chart 6.22.0 uses camelCase top-level keys (verified with
  # `helm show values`); the kebab-case keys previously here matched nothing,
  # so the canary DaemonSet and both Memcached caches stayed on by default.
  lokiCanary:
    enabled: false
  # The chart's helm-test hook requires the canary, so it must go too.
  test:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Turn off the scalable microservice targets explicitly
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false

promtail:
  config:
    clients:
      - url: http://metrics-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
