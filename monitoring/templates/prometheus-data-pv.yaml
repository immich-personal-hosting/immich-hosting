# Scoped to /export/storage/metrics/prometheus (was the export root, /export/storage,
# which shared the volume with the photo library). Renamed from prometheus-data-pv
# because the old PV object is stuck Terminating (pv-protection) and its name can't be reused.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv-scoped
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: metrics
    storage.type: nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-manual
  mountOptions:
    - nfsvers=3
    - hard
    - timeo=600
    - retrans=2
    - noresvport
  nfs:
    server: omv
    path: /export/storage/metrics/prometheus
