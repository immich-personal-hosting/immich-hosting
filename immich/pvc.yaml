# Photo library storage (NFS) — not part of the immich-app chart release. Apply with:
#   kubectl apply -f pvc.yaml -n immich
#
# Split out of the combined immich-volumes.yaml on the Pi (which also has the Postgres
# local-storage PV/PVC — see ../postgres/pvc.yaml for that half). Verified byte-identical
# to /home/divyakumarjain/photos/immich/k3s/immich-volumes.yaml and
# immich-infra/docs/audit-raw/raw-manifests/immich-volumes.yaml.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-nfs-pv
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /export/storage/Personal/Immich
    server: omv # IP of your NFS server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-nfs-pvc
  namespace: immich # not present in the source dump; added — this PVC is consumed by the
                      # immich-server pod in the immich namespace, no other namespace fits
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "" # Leave empty to bind to the manual PV
  resources:
    requests:
      storage: 1Ti
  volumeName: immich-nfs-pv
