# Values for the immich-app chart, as actually running on the cluster
# (verified byte-identical to /home/divyakumarjain/photos/immich/k3s/immich-cv.yaml on
# raspberrypi and to immich-infra/docs/audit-raw/raw-manifests/immich-cv.yaml).

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0
        env:
          REDIS_HOSTNAME: "immich-valkey"
          # CRITICAL FIX FOR v3: Explicitly map your network service endpoint strings here
          DB_HOSTNAME: "immich-postgres-service"
          DB_PORT: "5432"
          DB_USERNAME: "postgres"
          # KNOWN GAP (see immich-infra/docs/CURRENT_STATE.md "Known gaps"): this is a
          # plaintext literal, not sourced from a Secret. Don't "fix" this silently by
          # swapping in a Secret ref without also rotating the actual Postgres password —
          # see ../secrets/README.md for the intended pattern once that's ready.
          DB_PASSWORD: "postgres"
          DB_DATABASE_NAME: "immich"
          IMMICH_TELEMETRY_INCLUDE: "all"
          IMMICH_LOG_FORMAT: "json"
          IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"


service:
  main:
    ports:
      http:
        port: 2283
      metrics:
        port: 8081
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "8081"


# Hailo-8 NPU pass-through is NOT configured here. The block that used to live here sat under
# a key chart 0.13.1 doesn't read (`immich-machine-learning`), so it never applied to the live
# pod (verified 2026-09-20: not privileged, no /dev/hailo0). Work in progress, on hold until the
# hardware/model compilation is ready, is kept off main on branch `wip/hailo-overlay`.

# Mount Immich Photos directly to your NFS folder
immich:
  persistence:
    library:
      existingClaim: "immich-nfs-pvc" # see pvc.yaml in this directory

# Enable the built-in Valkey instance to handle application caching
valkey:
  enabled: true
