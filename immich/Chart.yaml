apiVersion: v2
name: immich
description: Wrapper chart pinning the upstream immich-app chart, plus this cluster's overrides
type: application
version: 0.1.0
appVersion: "v3.1.0" # actual deployed image tag; see values.yaml — the chart's own appVersion label reports v3.0.0

dependencies:
  - name: immich
    repository: "oci://ghcr.io/immich-app/immich-charts"
    # CONFIRMED 2026-09-20: `helm list -A` on the cluster reports chart `immich-0.13.1` (app label v3.0.0;
    # the running image tag is overridden to v3.1.0 in values.yaml), and every upgrade since has been run
    # with `--version 0.13.1`. (An earlier shell-history hint of `--version 3.1.0` was a failed attempt.)
    # Always pass --version explicitly: `helm upgrade` without it would pull the newest chart.
    version: "0.13.1"
