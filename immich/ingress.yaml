# Raw manifests (not part of the immich-app chart release) — apply with:
#   kubectl apply -f ingress.yaml -n immich
#
# Verified byte-identical to /home/divyakumarjain/photos/immich/k3s/immich-ingress.yaml on
# raspberrypi and immich-infra/docs/audit-raw/raw-manifests/immich-ingress.yaml.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  namespace: immich
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: immich-immich-buffering@kubernetescrd

spec:
  # CRITICAL ROUTING FIX: This forces Traefik to look at this Ingress file
  ingressClassName: traefik
  rules:
  - host: "immich.raspberrypi"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: 2283

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-buffering
  namespace: immich
spec:
  buffering:
    maxRequestBodyBytes: 10485760000 # Fixes the cutoff text to a clean 10GB buffer limit

# TLS: deliberately deferred (decision 2026-09-20). This Ingress serves plaintext HTTP on the
# LAN. `immich.raspberrypi` is a private name, so public ACME can't issue for it, and no public
# domain is owned. The old letsencrypt-prod ClusterIssuer was removed (invalid ACME URL, never
# usable). If TLS is wanted later: a domain + Let's Encrypt DNS-01, or a private CA issuer.
