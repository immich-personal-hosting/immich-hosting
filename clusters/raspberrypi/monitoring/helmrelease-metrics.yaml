    grafana:
      admin:
        # Was "" (chart auto-generates/self-manages the Secret) when this draft was first
        # written. Now pointed at the SOPS-managed metrics-grafana Secret from
        # clusters/raspberrypi/secrets/grafana-admin.enc.yaml (see PR #3) instead, so Flux
        # doesn't fight the chart's own auto-generation logic once this is unsuspended.
