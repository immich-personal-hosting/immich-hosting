    promtail:
      affinity: {}
      annotations: {}
      automountServiceAccountToken: true
      config:
        clients:
        - url: http://metrics-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
        enableTracing: false
        enabled: true
        file: |
          server:
            log_level: {{ .Values.config.logLevel }}
            log_format: {{ .Values.config.logFormat }}
            http_listen_port: {{ .Values.config.serverPort }}
            {{- with .Values.httpPathPrefix }}
            http_path_prefix: {{ . }}
            {{- end }}
            {{- tpl .Values.config.snippets.extraServerConfigs . | nindent 2 }}

          clients:
            {{- tpl (toYaml .Values.config.clients) . | nindent 2 }}

          positions:
            {{- tpl (toYaml .Values.config.positions) . | nindent 2 }}

          scrape_configs:
            {{- tpl .Values.config.snippets.scrapeConfigs . | nindent 2 }}
            {{- tpl .Values.config.snippets.extraScrapeConfigs . | nindent 2 }}

          limits_config:
            {{- tpl .Values.config.snippets.extraLimitsConfig . | nindent 2 }}

          tracing:
            enabled: {{ .Values.config.enableTracing }}
        logFormat: logfmt
        logLevel: info
        positions:
          filename: /run/promtail/positions.yaml
        serverPort: 3101
        snippets:
          addScrapeJobLabel: false
          common:
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_node_name
            target_label: node_name
          - action: replace
            source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            replacement: $1
            separator: /
            source_labels:
            - namespace
            - app
            target_label: job
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_container_name
            target_label: container
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
            - __meta_kubernetes_pod_uid
            - __meta_kubernetes_pod_container_name
            target_label: __path__
          - action: replace
            regex: true/(.*)
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
            - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
            - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
            - __meta_kubernetes_pod_container_name
            target_label: __path__
          extraLimitsConfig: ""
          extraRelabelConfigs: []
          extraScrapeConfigs: ""
          extraServerConfigs: ""
          pipelineStages:
          - cri: {}
          scrapeConfigs: |
            # See also https://github.com/grafana/loki/blob/master/production/ksonnet/promtail/scrape_config.libsonnet for reference
            - job_name: kubernetes-pods
              pipeline_stages:
                {{- toYaml .Values.config.snippets.pipelineStages | nindent 4 }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_pod_controller_name
                  regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
                  action: replace
                  target_label: __tmp_controller_name
                - source_labels:
                    - __meta_kubernetes_pod_label_app_kubernetes_io_name
                    - __meta_kubernetes_pod_label_app
                    - __tmp_controller_name
                    - __meta_kubernetes_pod_name
                  regex: ^;*([^;]+)(;.*)?$
                  action: replace
                  target_label: app
                - source_labels:
                    - __meta_kubernetes_pod_label_app_kubernetes_io_instance
                    - __meta_kubernetes_pod_label_instance
                  regex: ^;*([^;]+)(;.*)?$
                  action: replace
                  target_label: instance
                - source_labels:
                    - __meta_kubernetes_pod_label_app_kubernetes_io_component
                    - __meta_kubernetes_pod_label_component
                  regex: ^;*([^;]+)(;.*)?$
                  action: replace
                  target_label: component
                {{- if .Values.config.snippets.addScrapeJobLabel }}
                - replacement: kubernetes-pods
                  target_label: scrape_job
                {{- end }}
                {{- toYaml .Values.config.snippets.common | nindent 4 }}
                {{- with .Values.config.snippets.extraRelabelConfigs }}
                {{- toYaml . | nindent 4 }}
                {{- end }}
      configmap:
        enabled: false
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
