# Adopts the existing `metrics` Helm release (installed by hand, revision 14 per
# `helm list -A`) under Flux management. Was suspend: true while under review; flipped to
# false to let helm-controller actually take over reconciliation -- see the PR description
# for the dry-run diff that was checked before doing so.
#
# spec.values below is `helm get values metrics -n monitoring -a` (full computed values,
# not just the overrides in monitoring/values.yaml) captured live on 2026-09-14, with one
# field redacted -- search this file for "TODO(secret)" -- and grafana.admin.existingSecret
# repointed at a SOPS-managed Secret (see PR #3) instead of the chart auto-generating one.
#
# NOTE on chart.spec.sourceRef: `metrics` is a local umbrella chart (monitoring/Chart.yaml
# in this repo, version 0.1.0) with four dependencies vendored via Chart.lock -- it is not
# itself published to prometheus-community/grafana, only its subcharts are. So this
# HelmRelease sources the chart from the `flux-system` GitRepository (already registered,
# watching this repo) at path ./monitoring, NOT from the HelmRepository objects in
# helmrepositories.yaml alongside this file. Those HelmRepository resources are declared as
# requested for the two upstream chart sources, but source-controller will actually resolve
# metrics/Chart.yaml's dependency `repository:` URLs directly when building the chart from
# git -- they aren't wired into this HelmRelease's sourceRef. See the PR description for
# the full list of things flagged here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics
  namespace: monitoring
spec:
  interval: 30m
  suspend: false
  releaseName: metrics
  chart:
    spec:
      chart: ./monitoring
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      # NOTE: version is not meaningful for a GitRepository-sourced chart -- Flux uses
      # whatever version is in Chart.yaml at the resolved git revision, currently 0.1.0.
      # Flagged in the PR description as a field that didn't map cleanly.
  install:
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    remediation:
      retries: 3
    disableWait: true
  # disableWait above: prometheus-data-pv (monitoring/templates/prometheus-data-pv.yaml)
  # has been stuck reporting status: Terminating for ~50 days (pre-existing, unrelated to
  # this migration -- looks like a `kubectl delete pv` was run against it at some point and
  # the kubernetes.io/pv-protection finalizer is blocking actual deletion since it's still
  # Bound; the PVC is Bound and Prometheus has been reading/writing it fine the whole time).
  # helm-controller's default active readiness-wait timed out against that status and
  # marked the upgrade failed, which the previous manual `helm upgrade --install ... `
  # (no --wait flag, per monitoring/README.md) never hit. disableWait restores that same
  # non-waiting behavior rather than trying to fix the stuck PV object under this PR.
