# Raw manifests (not part of the immich-app chart release). Flux-managed (this directory,
# via the root flux-system Kustomization). Break-glass manual fallback if Flux is
# suspended: kubectl apply -f clusters/raspberrypi/immich/ingress.yaml -n immich
#
# Verified byte-identical to /home/divyakumarjain/photos/immich/k3s/immich-ingress.yaml on
# raspberrypi and immich-infra/docs/audit-raw/raw-manifests/immich-ingress.yaml.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  namespace: immich
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # No buffering middleware (removed 2026-11-08). Traefik has no request body size limit by
    # default, and the old `immich-buffering` Middleware spooled every upload to the Traefik
    # pod's /tmp before forwarding a byte to Immich. Upload timeouts are handled on the `web`
    # entrypoint instead: see clusters/raspberrypi/traefik/helmchartconfig.yaml.

spec:
  # CRITICAL ROUTING FIX: This forces Traefik to look at this Ingress file
  ingressClassName: traefik
  rules:
  - host: "immich.raspberrypi"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: 2283

# TLS: deliberately deferred (decision 2026-09-20). This Ingress serves plaintext HTTP on the
# LAN. `immich.raspberrypi` is a private name, so public ACME can't issue for it, and no public
# domain is owned. The old letsencrypt-prod ClusterIssuer was removed (invalid ACME URL, never
# usable). If TLS is wanted later: a domain + Let's Encrypt DNS-01, or a private CA issuer.
