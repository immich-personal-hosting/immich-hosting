# Explicit resource list, matching house style (see immich/'s kustomization.yaml, etc.).
# MIGRATION-TO-OMV.md lives in this same directory and is not a manifest — kept out of this
# list on purpose, same reasoning as when this directory held only the dedicated
# Kustomization CR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml
