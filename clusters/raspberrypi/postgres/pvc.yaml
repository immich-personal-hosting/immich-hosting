# Postgres storage on `omv` (node-local) -- not part of any Helm release. Flux-managed (this
# directory, via the root flux-system Kustomization). Break-glass manual fallback if Flux is
# suspended: kubectl apply -f clusters/raspberrypi/postgres/pvc.yaml
# See MIGRATION-TO-OMV.md (this directory) for the migration from the Raspberry Pi and how to
# roll back.
#
# SITE-SPECIFIC: `spec.local.path` below is the only place the data path is defined, and it is specific to this
# installation. Replicating elsewhere? See "Replicating this setup elsewhere" in the repo README.md
# (how to choose the path, the ownership it needs, and a preflight check).
#
# Why this path: it is the RAW mount of omv's RAID5 SSD array (OpenMediaVault mounts the filesystem at
# /srv/dev-disk-by-uuid-<UUID>; the UUID is stable if the array is renumbered), deliberately NOT under
# /export/storage. omv exports that to the whole LAN with no_root_squash, so anything under it is readable and
# writable as root by any LAN host; only its `storage/` subdirectory is exported, not this path's parent.
# The directory must exist before applying (ownership 999:999, mode 700; uid 999 is `dnsmasq` on omv's own OS,
# a harmless name collision): see MIGRATION-TO-OMV.md step 3.
#
# Capacity is nominal for a `local` PV (the filesystem has ~860G free). The DB is ~1.9G (a fresh restore is
# ~2.6G before checkpoint/vacuum), so 20Gi is generous headroom.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-omv-pv
  annotations:
    # Flux-managed (this directory, via the root flux-system Kustomization, prune: true).
    # A PV holding the live Postgres data must never be deleted just because it was removed
    # from Git — same reasoning, same annotation, as clusters/raspberrypi/namespaces/namespaces.yaml.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /srv/dev-disk-by-uuid-36f537fb-c606-4ed2-ae22-55ad447d5329/k8s/immich-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - omv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-omv-pvc
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 20Gi
  volumeName: postgres-omv-pv
