# Not Helm-managed — Postgres is deployed as a raw Kubernetes Deployment, not part of the
# Immich Helm release. Flux-managed (this directory, via the root flux-system Kustomization).
# Break-glass manual fallback if Flux is suspended: kubectl apply -f deployment.yaml -n immich
#
# NOTE (2026-09-20): earlier versions of this header claimed the file was byte-identical to
# the live cluster. It was not: it lacked the `args` below (`-c shared_preload_libraries=vchord.so`,
# which the running DB depends on -- `SHOW shared_preload_libraries` = vchord.so). Applying the old
# file would have dropped them. `args` now match live. Verify with `kubectl -n immich diff -f`
# before any apply.
#
# Runs on `omv` (moved from the Raspberry Pi's SD card to omv's RAID5 SSD array; see
# MIGRATION-TO-OMV.md). `omv` already holds the photo library, so Immich's dependencies drop from
# {Pi, omv} to {omv}. Resources are measured (6h of cAdvisor data): memory peak 373Mi, CPU peak 0.93
# cores / p95 0.16.
#
# KNOWN GAPS (see immich-infra/docs/CURRENT_STATE.md "Known gaps"):
#   - single replica, no HA/read replicas, no Patroni/operator
#   - backups: Immich's nightly dump to omv; restore rehearsed 2026-09-20 (needs the \restrict lines
#     stripped, see MIGRATION-TO-OMV.md); no off-box copy yet
# The password now comes from the SOPS-managed Secret immich-postgres-credentials. Note
# POSTGRES_PASSWORD is only honoured when the data directory is first initialised; the live role
# password was changed with ALTER ROLE.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  # Recreate, not RollingUpdate: pgdata is a node-local volume, and a surge pod would start a
  # second postgres against the same data directory while the first is still running.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: "omv"
      containers:
        - name: postgres
          # Match your exact Docker Swarm image version to keep disk compatibility
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
          args:
            - postgres
            - -c
            - shared_preload_libraries=vchord.so
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-credentials
                  key: postgres-password
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "immich"
          ports:
            - containerPort: 5432
          # Measured sizing. The memory limit is deliberately generous: an OOM kill of the database is far
          # worse than a little unused headroom. No CPU limit (p95 is 0.16 cores; bursts during index builds).
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # Mount the shared memory block inside the container
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-omv-pvc
        # Allocate shared memory for vector calculation performance
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
