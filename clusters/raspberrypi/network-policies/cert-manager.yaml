# cert-manager: ingress-only for now (egress is a later, riskier pass).
# Flows preserved: apiserver -> webhook, Prometheus -> :9402 metrics, kubelet probes (node-local,
# always allowed). Nothing else in the cluster calls these pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The API server (host network on raspberrypi) calls the admission webhook. While the webhook pod
# is on raspberrypi that is node-local and always allowed; this rule covers it moving to omv, where
# the call arrives from raspberrypi's flannel gateway address. The Service maps 443 -> 10250.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.0/32
      ports:
        - protocol: TCP
          port: 10250
---
# Prometheus scrapes :9402 on all three components (prometheus.io/scrape annotations).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9402
