# Apply with:
#   kubectl apply -f cluster-issuer.yaml
#
# Verified byte-identical to /home/divyakumarjain/photos/immich/cluster-issuer.yaml on
# raspberrypi (note: one level up from k3s/, not inside it) and
# immich-infra/docs/audit-raw/raw-manifests/cluster-issuer.yaml.
#
# KNOWN GAP (see immich-infra/docs/CURRENT_STATE.md "Known gaps") — left as-is, not fixed
# here:
#   - `server` below is not a valid ACME directory URL (should be
#     https://acme-v02.api.letsencrypt.org/directory). Even if fixed, no current Ingress
#     requests TLS through this issuer, and both Ingress hosts are `.raspberrypi`/LAN-only
#     names that public ACME couldn't issue for anyway. Whether TLS via this ClusterIssuer
#     was ever meant to work as configured is unconfirmed — needs the user's intent before
#     "fixing" it.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://letsencrypt.org
    email: divyakumarjain@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: traefik
