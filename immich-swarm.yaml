version: '3.8'
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - "nfs-immich-data:/data:rw"
      - /etc/localtime:/etc/localtime:ro
      - "nfs-data:/mnt/media/nfs-data:ro"
    env_file:
      - .env
    environment:
      IMMICH_WORKERS_INCLUDE: 'api'
    ports:
      - '2283:2283'
    networks:
      - immich
      - traefik_network
    depends_on:
      - redis
      - database
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_traefik_network"
        - "traefik.http.routers.immich.rule=Host(`divyakumarjain.duckdns.org`)"
        - "traefik.http.routers.immich.tls=true"
        - "traefik.http.routers.immich.tls.certresolver=myresolver"
        - "traefik.http.routers.immich.priority=0"
        - "traefik.http.services.immich.loadbalancer.server.port=2283"
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
    healthcheck:
      disable: false

  immich-microservices:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - "nfs-immich-data:/data:rw"
      - /etc/localtime:/etc/localtime:ro
      - "nfs-data:/mnt/media/nfs-data:ro"
    env_file:
      - .env
    environment:
      IMMICH_WORKERS_EXCLUDE: 'api'
      IMMICH_TELEMETRY_INCLUDE: 'all'
    networks:
      - immich
    deploy:
      mode: global
      placement:
        max_replicas_per_node: 1
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    env_file:
      - .env
    healthcheck:
      disable: false
    networks:
      - immich
    depends_on:
      - redis
      - database

  redis:
    image: docker.io/valkey/valkey:8-bookworm@sha256:facc1d2c3462975c34e10fccb167bfa92b0e0dbd992fc282c29a61c3243afb11
    networks:
      - immich
    healthcheck:
      test: redis-cli ping || exit 1
    deploy:
      placement:
        constraints:
          - node.role == manager

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    networks:
      - immich
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - "node.role == manager"

volumes:
  postgres_data:
    external: true
    name: immich_postgres
  nfs-immich-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.164,nfsvers=3,nolock,soft,rw"
      device: :/export/storage/Personal/Immich
  nfs-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.164,nfsvers=3,nolock,soft,rw"
      device: :/export/storage

networks:
  traefik_network:
    name: traefik_traefik_network
    external: true
  immich:
    driver: overlay
    attachable: true
