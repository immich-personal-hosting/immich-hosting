# Postgres storage on `omv` (node-local) -- not part of any Helm release, applied directly:
#   kubectl apply -f postgres/pvc.yaml
# See MIGRATION-TO-OMV.md for the migration from the Raspberry Pi and how to roll back.
#
# The volume is a directory on the RAID5 SSD array (md0), on the RAW mount of that filesystem
# (/srv/dev-disk-by-uuid-...), NOT under /export/storage: omv exports /export/storage to the whole LAN with
# no_root_squash, so anything under it is readable/writable as root by any LAN host. Only the `storage/`
# subdirectory is exported; its parent (this path) is not.
#
# Prerequisite (creates the directory with the ownership Postgres needs; uid/gid 999 is `dnsmasq` on omv's
# own OS, so this is only a name collision -- the directory is mode 700):
#   sudo mkdir -p /srv/dev-disk-by-uuid-36f537fb-c606-4ed2-ae22-55ad447d5329/k8s/immich-postgres
#   sudo chown 999:999 /srv/dev-disk-by-uuid-36f537fb-c606-4ed2-ae22-55ad447d5329/k8s/immich-postgres
#   sudo chmod 700     /srv/dev-disk-by-uuid-36f537fb-c606-4ed2-ae22-55ad447d5329/k8s/immich-postgres
#
# Capacity is nominal for a `local` PV (the filesystem has ~860G free). The DB is ~1.9G (a fresh restore is
# ~2.6G before checkpoint/vacuum), so 20Gi is generous headroom.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-omv-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /srv/dev-disk-by-uuid-36f537fb-c606-4ed2-ae22-55ad447d5329/k8s/immich-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - omv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-omv-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 20Gi
  volumeName: postgres-omv-pv
