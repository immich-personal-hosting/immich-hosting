# Not Helm-managed — Postgres is deployed as a raw Kubernetes Deployment, not part of the
# Immich Helm release. Apply with:
#   kubectl apply -f deployment.yaml -n immich
#
# NOTE (2026-09-20): earlier versions of this header claimed the file was byte-identical to
# the live cluster. It was not: it lacked the `args` below (`-c shared_preload_libraries=vchord.so`,
# which the running DB depends on -- `SHOW shared_preload_libraries` = vchord.so). Applying the old
# file would have dropped them. `args` now match live. Verify with `kubectl -n immich diff -f`
# before any apply.
#
# KNOWN GAPS (see immich-infra/docs/CURRENT_STATE.md "Known gaps"):
#   - single replica, no HA/read replicas, no Patroni/operator
#   - no backup strategy (see postgres/pvc.yaml)
# The password now comes from the SOPS-managed Secret immich-postgres-credentials. Note
# POSTGRES_PASSWORD is only honoured when the data directory is first initialised; the live role
# password was changed with ALTER ROLE.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  # Recreate, not RollingUpdate: pgdata is a node-local volume, and a surge pod would start a
  # second postgres against the same data directory while the first is still running.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: "raspberrypi"
      containers:
        - name: postgres
          # Match your exact Docker Swarm image version to keep disk compatibility
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
          args:
            - postgres
            - -c
            - shared_preload_libraries=vchord.so
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-credentials
                  key: postgres-password
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "immich"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # Mount the shared memory block inside the container
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-local-pvc
        # Allocate shared memory for vector calculation performance
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
